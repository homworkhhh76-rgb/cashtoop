<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام المراسلة الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { primary: '#128C7E', primaryDark: '#075E54', accent: '#25D366', sms: '#3b82f6' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-active { border-bottom: 3px solid #25D366; color: #128C7E; font-weight: bold; }
        .swal2-title, .swal2-html-container, .swal2-confirm, .swal2-cancel { font-family: 'Cairo', sans-serif !important; }
    </style>
</head>
<body class="flex justify-center items-start min-h-screen">

    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative flex flex-col">
        
        <header class="bg-primary text-white p-4 sticky top-0 z-10 shadow-md">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-xl font-bold"><i class="fa-brands fa-whatsapp ml-2"></i>المرسل الاحترافي</h1>
                <div class="flex gap-2">
                    <label class="cursor-pointer text-sm bg-primaryDark px-2 py-1 rounded hover:bg-opacity-80 transition" title="استيراد نسخة احتياطية">
                        <i class="fa-solid fa-file-import"></i>
                        <input type="file" accept=".json" class="hidden" onchange="importBackup(event)">
                    </label>
                    <button onclick="exportBackup()" class="text-sm bg-primaryDark px-2 py-1 rounded hover:bg-opacity-80 transition" title="تصدير نسخة احتياطية">
                        <i class="fa-solid fa-file-export"></i>
                    </button>
                    <button onclick="clearData()" class="text-sm bg-red-500 px-2 py-1 rounded hover:bg-red-600 transition" title="مسح">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </div>
            <div class="flex text-center text-sm font-semibold">
                <button onclick="switchTab('contacts')" id="tab-contacts" class="flex-1 pb-2 tab-active transition">جهات الاتصال</button>
                <button onclick="switchTab('message')" id="tab-message" class="flex-1 pb-2 text-primary-100 transition">الرسالة والمرفقات</button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto pb-32 hide-scrollbar w-full">
            
            <!-- CONTACTS TAB -->
            <div id="contacts-section" class="p-4 space-y-4">
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 shadow-sm">
                    <h2 class="text-sm font-bold text-gray-700 mb-3"><i class="fa-solid fa-user-plus ml-1"></i>إضافة رقم جديد</h2>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="text" id="contact-name" placeholder="الاسم (اختياري)" class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:border-accent">
                        <input type="tel" id="contact-phone" placeholder="الرقم (بدون 972)" class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:border-accent text-left" dir="ltr">
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="contact-label" placeholder="التسمية (مثال: عملاء جدد)" class="flex-1 p-2 border rounded-lg text-sm focus:outline-none focus:border-accent">
                        <button onclick="addContact()" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primaryDark transition shadow-md"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>

                <div>
                    <div class="flex gap-2 overflow-x-auto hide-scrollbar py-1 mb-2" id="labels-container"></div>
                </div>

                <div class="flex justify-between items-center mb-2 px-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="select-all" class="w-4 h-4 text-accent rounded" onchange="toggleSelectAll()">
                        <span class="text-sm font-bold text-gray-700">تحديد الكل</span>
                    </label>
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <button onclick="copySingleNextNumber()" class="text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold px-2 py-1.5 rounded-lg border border-emerald-200 transition shadow-sm" title="نسخ الرقم التالي للحافظة">
                            <i class="fa-solid fa-copy"></i> نسخ التالي
                        </button>
                        <button onclick="resetCopyIndex()" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 font-bold px-2 py-1.5 rounded-lg border border-red-200 transition shadow-sm" title="تفريغ الحافظة وإعادة التعيين">
                            <i class="fa-solid fa-rotate-right"></i> تفريغ
                        </button>
                        <span id="selected-count" class="text-xs bg-gray-200 px-2 py-1.5 rounded-full text-gray-600">0 محدد</span>
                    </div>
                </div>
                
                <div id="contacts-list" class="space-y-2"></div>
            </div>

            <!-- MESSAGE TAB -->
            <div id="message-section" class="p-4 space-y-4 hidden">
                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="p-3 bg-gray-50 border-b flex justify-between items-center">
                        <span class="text-sm font-bold text-gray-700">محتوى الرسالة</span>
                    </div>
                    <textarea id="message-text" rows="6" placeholder="اكتب رسالتك هنا..." class="w-full p-3 focus:outline-none resize-none text-gray-800" oninput="saveData()"></textarea>
                </div>

                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs text-emerald-800">
                    <i class="fa-solid fa-circle-check ml-1"></i>
                    <strong>النظام الاحترافي:</strong> استخدم زر "نسخ التالي" لنسخ الأرقام واحد تلو الآخر، وزر "تفريغ" لمسح الذاكرة والحافظة لتجنب أي أخطاء.
                </div>

                <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">إرفاق صور</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="image-upload" class="flex flex-col items-center justify-center w-full h-20 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition">
                            <div class="flex items-center justify-center gap-2">
                                <i class="fa-solid fa-images text-xl text-gray-400"></i>
                                <span class="text-sm text-gray-500 font-semibold">اضغط لاختيار صور</span>
                            </div>
                            <input id="image-upload" type="file" accept="image/png, image/jpeg" multiple class="hidden" onchange="handleMultipleImagesUpload(event)" />
                        </label>
                    </div>
                    
                    <!-- حاوية عرض الصور -->
                    <div id="images-preview-container" class="grid grid-cols-2 gap-3 mt-4">
                        <!-- سيتم توليد الصور هنا -->
                    </div>
                </div>
            </div>

        </main>

        <!-- Floating Action Buttons -->
        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md p-4 bg-white border-t shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] flex gap-2 z-50">
            <button onclick="startSendingQueue('whatsapp')" class="flex-1 bg-accent hover:bg-green-600 text-white font-bold py-3 px-2 rounded-xl shadow-lg transition flex justify-center items-center gap-2 text-sm">
                <i class="fa-brands fa-whatsapp text-lg"></i> إرسال واتس أعمال
            </button>
            <button onclick="startSendingQueue('sms')" class="flex-1 bg-sms hover:bg-blue-600 text-white font-bold py-3 px-2 rounded-xl shadow-lg transition flex justify-center items-center gap-2 text-sm">
                <i class="fa-solid fa-comment-sms text-lg"></i> إرسال SMS 
            </button>
        </div>

    </div>

    <script>
        let appData = { contacts: [], message: '', images: [] };
        let currentLabel = 'الكل';
        let sendQueue = [];
        let currentSendIndex = 0;
        let currentSendType = 'whatsapp';
        let singleCopyIndex = 0; // مؤشر للنسخ الفردي المتتابع

        window.onload = () => { loadData(); renderLabels(); renderContacts(); renderImages(); };

        function switchTab(tab) {
            document.getElementById('contacts-section').classList.toggle('hidden', tab !== 'contacts');
            document.getElementById('message-section').classList.toggle('hidden', tab !== 'message');
            
            const tabContacts = document.getElementById('tab-contacts');
            const tabMessage = document.getElementById('tab-message');

            if(tab === 'contacts') {
                tabContacts.className = "flex-1 pb-2 tab-active transition";
                tabMessage.className = "flex-1 pb-2 text-primary-100 transition";
            } else {
                tabMessage.className = "flex-1 pb-2 tab-active transition";
                tabContacts.className = "flex-1 pb-2 text-primary-100 transition";
            }
        }

        function loadData() {
            const savedData = localStorage.getItem('pro_sender_data_v2');
            if (savedData) {
                appData = JSON.parse(savedData);
                if(!appData.images) appData.images = [];
                document.getElementById('message-text').value = appData.message || '';
            }
        }

        function saveData() {
            appData.message = document.getElementById('message-text').value;
            localStorage.setItem('pro_sender_data_v2', JSON.stringify(appData));
            updateSelectedCount();
        }

        function clearData() {
            Swal.fire({
                title: 'هل أنت متأكد؟',
                text: "سيتم مسح جميع البيانات!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'نعم',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    appData = { contacts: [], message: '', images: [] };
                    document.getElementById('message-text').value = '';
                    singleCopyIndex = 0;
                    saveData(); renderLabels(); renderContacts(); renderImages();
                }
            });
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const dlNode = document.createElement('a');
            dlNode.setAttribute("href", dataStr);
            dlNode.setAttribute("download", "backup_sender.json");
            document.body.appendChild(dlNode); dlNode.click(); dlNode.remove();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    appData = JSON.parse(e.target.result);
                    if(!appData.images) appData.images = [];
                    singleCopyIndex = 0;
                    saveData(); renderLabels(); renderContacts(); renderImages();
                    Swal.fire({ icon: 'success', title: 'تم', text: 'تم الاستيراد', timer: 1500, showConfirmButton: false });
                } catch (error) { Swal.fire({ icon: 'error', title: 'خطأ', text: 'ملف غير صالح!' }); }
            };
            reader.readAsText(file);
        }

        function addContact() {
            let name = document.getElementById('contact-name').value.trim() || 'عميل جديد';
            let rawPhone = document.getElementById('contact-phone').value.trim();
            const label = document.getElementById('contact-label').value.trim() || 'عام';

            if (!rawPhone) { Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'الرجاء إدخال رقم الهاتف' }); return; }

            let phone = rawPhone.replace(/\D/g, ''); 
            if (phone.startsWith('0')) phone = phone.substring(1); 
            if (!phone.startsWith('972')) phone = '972' + phone; 

            appData.contacts.push({ id: Date.now(), name, phone, label, selected: false });
            
            document.getElementById('contact-name').value = '';
            document.getElementById('contact-phone').value = '';
            saveData(); renderLabels(); renderContacts();
            
            Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1000 }).fire({ icon: 'success', title: 'تمت الإضافة' });
        }

        // --- نافذة منبثقة احترافية لحذف الرقم ---
        function deleteContact(id) {
            Swal.fire({
                title: 'هل تريد حذف هذا الرقم؟',
                text: "لن يمكنك التراجع عن هذا الإجراء!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'نعم، حذف',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    appData.contacts = appData.contacts.filter(c => c.id !== id); 
                    singleCopyIndex = 0;
                    saveData(); renderLabels(); renderContacts();
                    Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1000 }).fire({ icon: 'success', title: 'تم الحذف بنجاح' });
                }
            });
        }
        
        function toggleContactSelection(id) { const contact = appData.contacts.find(c => c.id === id); if (contact) { contact.selected = !contact.selected; saveData(); } }
        function toggleSelectAll() { const isChecked = document.getElementById('select-all').checked; appData.contacts.forEach(c => { if(currentLabel === 'الكل' || c.label === currentLabel) c.selected = isChecked; }); saveData(); renderContacts(); }
        function setLabelFilter(label) { currentLabel = label; singleCopyIndex = 0; renderLabels(); renderContacts(); }

        // --- دالة نسخ الرقم التالي بالتوالي وحتي النهاية مع إشعار "انتهى" ---
        async function copySingleNextNumber() {
            let targetContacts = appData.contacts.filter(c => c.selected);
            if (targetContacts.length === 0) {
                targetContacts = appData.contacts.filter(c => currentLabel === 'الكل' || c.label === currentLabel);
            }

            if (targetContacts.length === 0) {
                Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'لا توجد أرقام للنسخ!' });
                return;
            }

            if (singleCopyIndex >= targetContacts.length) {
                Swal.fire({
                    icon: 'info',
                    title: 'انتهى!',
                    text: 'تم نسخ جميع الأرقام المحددة بالكامل.',
                    confirmButtonColor: '#128C7E'
                });
                return;
            }

            let currentContact = targetContacts[singleCopyIndex];

            try {
                await navigator.clipboard.writeText(currentContact.phone);
                
                Swal.mixin({
                    toast: true,
                    position: 'top',
                    showConfirmButton: false,
                    timer: 2000
                }).fire({
                    icon: 'success',
                    title: `تم نسخ: ${currentContact.name} (${currentContact.phone}) [${singleCopyIndex + 1}/${targetContacts.length}]`
                });

                singleCopyIndex++;
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'فشل النسخ إلى الحافظة' });
            }
        }

        // --- دالة تفريغ الحافظة وإعادة التعيين ---
        async function resetCopyIndex() {
            singleCopyIndex = 0;
            try {
                await navigator.clipboard.writeText(''); // تفريغ نص الحافظة
            } catch(e) {}
            
            Swal.mixin({
                toast: true,
                position: 'top',
                showConfirmButton: false,
                timer: 1500
            }).fire({
                icon: 'success',
                title: 'تم تفريغ الحافظة وإعادة تعيين العداد بنجاح'
            });
        }

        function handleMultipleImagesUpload(event) {
            const files = event.target.files;
            if (files && files.length > 0) {
                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) { 
                        appData.images.push(e.target.result); 
                        saveData(); 
                        renderImages(); 
                    };
                    reader.readAsDataURL(file);
                });
            }
        }

        function renderImages() {
            const container = document.getElementById('images-preview-container');
            if (appData.images.length === 0) {
                container.innerHTML = ''; return;
            }
            
            container.innerHTML = appData.images.map((img, index) => `
                <div class="relative bg-white p-2 rounded-xl border shadow-sm flex flex-col gap-2">
                    <img src="${img}" class="w-full h-24 object-cover rounded-lg border border-gray-100">
                    <button onclick="removeImage(${index})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow text-xs"><i class="fa-solid fa-xmark"></i></button>
                    <a href="${img}" download="image_${index}.jpg" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 text-xs rounded-lg text-center transition shadow block">📥 تحميل الصورة</a>
                </div>
            `).join('');
        }

        function removeImage(index) { appData.images.splice(index, 1); saveData(); renderImages(); }

        function renderLabels() {
            const labels = ['الكل', ...new Set(appData.contacts.map(c => c.label))];
            const container = document.getElementById('labels-container');
            container.innerHTML = labels.map(label => `
                <button onclick="setLabelFilter('${label}')" class="whitespace-nowrap px-4 py-1 rounded-full text-sm font-semibold transition ${currentLabel === label ? 'bg-primary text-white shadow' : 'bg-gray-200 text-gray-700'}">${label}</button>
            `).join('');
        }

        function renderContacts() {
            const container = document.getElementById('contacts-list');
            const filtered = appData.contacts.filter(c => currentLabel === 'الكل' || c.label === currentLabel);
            document.getElementById('select-all').checked = (filtered.length > 0 && filtered.every(c => c.selected));

            container.innerHTML = filtered.map(c => `
                <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-gray-100 shadow-sm transition hover:shadow-md">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${c.selected ? 'checked' : ''} onchange="toggleContactSelection(${c.id})" class="w-5 h-5 text-accent rounded border-gray-300 focus:ring-accent">
                        <div>
                            <p class="font-bold text-gray-800 text-sm">${c.name}</p>
                            <p class="text-xs text-gray-500 font-mono" dir="ltr">+${c.phone}</p>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-1">
                        <span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${c.label}</span>
                        <button onclick="deleteContact(${c.id})" class="text-red-400 hover:text-red-600 transition"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('');
            if(filtered.length === 0) container.innerHTML = `<div class="text-center text-gray-400 py-8 text-sm"><i class="fa-solid fa-address-book text-3xl mb-2"></i><br>لا توجد أرقام هنا</div>`;
            updateSelectedCount();
        }
        
        function updateSelectedCount() { document.getElementById('selected-count').innerText = `${appData.contacts.filter(c => c.selected).length} محدد`; }

        function startSendingQueue(type) {
            sendQueue = appData.contacts.filter(c => c.selected);
            if(sendQueue.length === 0) { Swal.fire({ icon: 'error', title: 'خطأ', text: 'الرجاء تحديد جهة اتصال' }); return; }
            if(!appData.message && appData.images.length === 0) { Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'الرسالة والصور فارغة' }); return; }

            if (type === 'sms') {
                const phones = sendQueue.map(c => '+' + c.phone).join(',');
                const text = encodeURIComponent(appData.message);
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                let url = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream ? `sms:${phones}&body=${text}` : `sms:${phones}?body=${text}`;
                window.open(url, '_self'); 
            } else if (type === 'whatsapp') {
                currentSendType = 'whatsapp';
                currentSendIndex = 0;
                showSendingProgress();
            }
        }

        function showSendingProgress() {
            if (currentSendIndex >= sendQueue.length) {
                Swal.fire({ icon: 'success', title: 'اكتمل الإرسال!', text: `تم الانتهاء بنجاح.` });
                return;
            }

            const contact = sendQueue[currentSendIndex];
            const progressPercentage = Math.round((currentSendIndex / sendQueue.length) * 100);

            let alertHtml = `
                <div class="mb-3 text-gray-600">
                    الوجهة: <strong>${contact.name}</strong><br>
                    الرقم: <span dir="ltr">+${contact.phone}</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5 mb-2">
                    <div class="bg-primary h-2.5 rounded-full" style="width: ${progressPercentage}%"></div>
                </div>
            `;

            Swal.fire({
                title: `جاري الإرسال (${currentSendIndex + 1}/${sendQueue.length})`,
                html: alertHtml,
                icon: 'question',
                confirmButtonText: '<i class="fa-solid fa-paper-plane"></i> فتح محادثة العميل مباشرة',
                showCancelButton: true,
                cancelButtonText: 'إيقاف مؤقت',
                confirmButtonColor: '#128C7E',
                allowOutsideClick: false
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        await navigator.clipboard.writeText(appData.message);
                    } catch(e) {}

                    const text = encodeURIComponent(appData.message);
                    const directUrl = `https://api.whatsapp.com/send?phone=${contact.phone}&text=${text}`;
                    window.open(directUrl, '_self');
                    
                    currentSendIndex++;
                    setTimeout(showSendingProgress, 1000);
                }
            });
        }
    </script>
</body>
</html>
