<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d28d9"><title>دفتر كاش توب — تسجيل الدخول</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at top,#ede5ff,transparent 65%),#f7f6fb;color:#252036;font-family:Cairo,Tahoma,sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,textarea:focus-visible{outline:3px solid #c4b5fd;outline-offset:3px}[hidden]{display:none!important}.card{width:min(460px,100%);padding:28px;border:1px solid #e9e3f3;border-radius:25px;background:white;box-shadow:0 20px 65px #40207012}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;object-fit:contain;border-radius:14px}.brand b{font-size:22px}.brand small{display:block;color:#857b94;font-size:11px}h1{font-size:22px;margin:25px 0 8px}.intro{font-size:13px;line-height:1.9;color:#7d718d;margin:0 0 24px}.section-title{font-weight:800;font-size:13px;margin-bottom:12px;display:flex;gap:7px;align-items:center;color:#6d28d9}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.dropzone{border:1.5px dashed #cbb8ed;background:#faf8ff;border-radius:17px;padding:25px 12px;text-align:center}.dropzone.dragging{background:#ede9fe;border-color:#6d28d9}.upload-icon{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 13px;border-radius:14px;background:#ede9fe;color:#6d28d9}.dropzone strong{font-size:14px}.dropzone p{font-size:11px;color:#857a96;margin:8px 0 18px}.choices{display:flex;align-items:center;justify-content:center;gap:10px}.file-button{border:1px solid #d8c9f0;background:white;color:#6d28d9;border-radius:10px;padding:10px 15px;font-size:12px;font-weight:800}.code-icon{width:38px;height:38px;display:grid;place-items:center;background:transparent;border:0;color:#6d28d9;padding:7px}.ready{display:flex;align-items:center;gap:10px;background:#f5f0ff;padding:13px;border-radius:12px;margin-top:14px;min-width:0}.ready div{min-width:0;flex:1}.ready strong{display:block;overflow-wrap:anywhere;font-size:12px;direction:ltr;text-align:right}.ready small{font-size:11px;color:#827492}.remove{background:transparent;border:0;color:#806b9b;font-size:24px}.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:17px;padding:12px;background:#6d28d9;border:0;border-radius:12px;color:white;font-size:14px;font-weight:800}.msg{margin-top:13px;font-size:12px;line-height:1.8;border-radius:10px;padding:11px;background:#fff0f1;color:#ac2443}.net{position:fixed;top:12px;left:12px;font-size:10px;color:#79698d;background:#ffffffc9;padding:5px 9px;border-radius:20px}.net::before{content:'';display:inline-block;width:6px;height:6px;border-radius:100%;background:#6d28d9;margin-left:6px}.net.off::before{background:#9ca3af}.overlay{position:fixed;inset:0;z-index:20;background:#1d103866;display:grid;place-items:center;padding:18px;backdrop-filter:blur(3px)}.dialog{width:min(410px,100%);background:white;border-radius:21px;padding:23px;box-shadow:0 20px 60px #190a3a33}.dialog h2{font-size:19px;margin:0 0 16px}.dialog textarea{width:100%;min-height:145px;resize:vertical;border:1px solid #d9cbed;border-radius:12px;padding:12px;direction:ltr;font-size:13px}.cancel{width:100%;border:0;background:transparent;color:#7e7090;padding:12px;margin-top:6px;font-size:13px}@media(max-width:420px){.card{padding:23px 19px}h1{font-size:20px}}
</style></head><body>
<div id="net" class="net">متصل</div>
<main class="card"><div class="brand"><img src="./app-logo.png" alt=""><div><b>دفتر كاش توب</b><small>حساباتك في مكان واحد</small></div></div><h1>مرحباً بك في دفتر كاش توب</h1><p class="intro">ادخل بنفس ملف دخول كاش توب الخاص بشركتك.</p>
<div class="section-title"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg>تسجيل الدخول بواسطة ملف التفعيل</div>
<div class="dropzone" id="dropzone"><div class="upload-icon"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></svg></div><strong>أرفق ملف التفعيل الخاص بحسابك</strong><p>اختر ملف التفعيل ‎.mzauth من جهازك للدخول.</p><div class="choices"><button class="file-button" id="chooseFile" type="button">اختيار ملف التفعيل</button><button id="codeToggle" type="button" class="code-icon" title="الدخول بواسطة الشيفرة" aria-label="الدخول بواسطة الشيفرة" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="5"/><path d="m12 13 8 8m-3-3 3-3m-6 0 3-3"/></svg></button></div></div>
<input id="activationFile" type="file" accept=".mzauth" hidden><div id="fileReady" class="ready" hidden><div><strong id="fileName"></strong><small>ملف الدخول المحدد</small></div><button id="removeFile" class="remove" aria-label="إزالة الملف">×</button></div><button id="loginBtn" class="primary" hidden>تسجيل الدخول</button><div id="msg" class="msg" role="alert" hidden></div></main>
<div id="codeDialog" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="codeTitle"><h2 id="codeTitle">الدخول بواسطة الشيفرة</h2><textarea id="activationCode" placeholder="الصق شفرة الدخول هنا" aria-label="شفرة الدخول" spellcheck="false" autocomplete="off"></textarea><div id="codeMsg" class="msg" role="alert" hidden></div><button id="codeLogin" class="primary" disabled>تسجيل الدخول</button><button id="codeCancel" class="cancel">إلغاء</button></section></div>
<script src="./oscar-activation-runtime.js"></script><script src="./direct-cloud.js"></script><script src="./login.js"></script></body></html>
