  <script>document.documentElement.classList.remove('dark');</script>
  <style>.ct-startup-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;background:#fafbff;color:#1e293b;padding:24px;font-family:Cairo,Tahoma,sans-serif;box-sizing:border-box}.ct-startup-screen h2{font-size:26px;max-width:420px;margin:0}.ct-startup-screen p{color:#64748b}.ct-loading-ring{width:66px;height:66px;border:6px solid #e5e7eb;border-top-color:#7c3aed;border-radius:50%;display:grid;place-items:center;animation:ct-spin .55s linear infinite}.ct-loading-ring span{font-size:65px;color:#7c3aed}.ct-loading-status{padding:18px 25px;border-radius:18px;background:#ede9fe;color:#6d28d9}@keyframes ct-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ct-loading-ring{animation:none}}</style><div id="root"><div class="ct-startup-screen" dir="rtl"><div class="ct-loading-ring" aria-label="جاري التشغيل"></div><div class="ct-loading-status" role="status">جاري تشغيل التطبيق…</div></div></div>
  <script>
/* Prepare offline storage silently; no cache banners are rendered. */
(() => {
  async function persist() {
    try { await navigator.storage?.persist?.(); } catch (_) {}
  }
  document.addEventListener('pointerdown', persist, {once:true});
  persist();
  if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
  let reloading = false;
  const wasControlled = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (wasControlled && !reloading) { reloading = true; location.reload(); }
  });
  async function setup() {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js?v=7.9.4.179-half-shekel', {updateViaCache:'none'});
      reg.update().catch(() => {});
    } catch (error) { console.warn('OFFLINE_SETUP', error); }
  }
  setup();
  window.addEventListener('online', setup);
})();

</script>
  <script type="module">
    try {
      await import('./main.js?v=7.9.4.179-half-shekel');
    } catch (error) {
      console.error('OSCAR_BOOT_ERROR', error);
      const root = document.getElementById('root');
      root.innerHTML = '<div class="ct-startup-screen" dir="rtl"><h2>تعذّر تحميل ملفات التطبيق</h2><p>اتصل بالإنترنت لإكمال تجهيز التشغيل بدون نت. بياناتك المحلية محفوظة.</p><button onclick="location.reload()">إعادة المحاولة</button></div>';
    }
  </script>
