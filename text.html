<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل فيديو يوتيوب احترافي</title>
    <style>
        :root {
            --primary-color: #ff0000;
            --primary-hover: #cc0000;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            min-width: 200px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .input-group button {
            padding: 15px 30px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            white-space: nowrap;
        }

        .input-group button:hover {
            background-color: var(--primary-hover);
        }

        .input-group button:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: var(--primary-color);
            margin-bottom: 15px;
            display: none;
            font-weight: bold;
        }

        /* حاوية الفيديو المتجاوبة (16:9 Aspect Ratio) */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* نسبة العرض إلى الارتفاع 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background-color: #000;
            display: none; /* مخفي افتراضياً حتى يتم جلب الفيديو */
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مشغل فيديو يوتيوب</h2>
        
        <div class="input-group">
            <input type="text" id="youtubeUrl" placeholder="ضع رابط فيديو يوتيوب هنا..." autocomplete="off">
            <button onclick="loadVideo()">عرض الفيديو</button>
        </div>

        <div id="errorMsg" class="error-msg">الرابط غير صحيح، يرجى التأكد من إدخال رابط يوتيوب صالح.</div>

        <div class="video-wrapper" id="videoWrapper">
            <iframe id="youtubePlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function loadVideo() {
            const urlInput = document.getElementById('youtubeUrl').value.trim();
            const videoWrapper = document.getElementById('videoWrapper');
            const player = document.getElementById('youtubePlayer');
            const errorMsg = document.getElementById('errorMsg');

            // إخفاء رسالة الخطأ في البداية
            errorMsg.style.display = 'none';

            if (!urlInput) {
                return;
            }

            // استخراج معرف الفيديو (Video ID) من الروابط المختلفة ليوتيوب
            const videoId = extractVideoID(urlInput);

            if (videoId) {
                // تحديث مصدر الإطار (iframe) وإظهاره
                player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                videoWrapper.style.display = 'block';
            } else {
                // إخفاء الفيديو وإظهار رسالة الخطأ
                videoWrapper.style.display = 'none';
                player.src = '';
                errorMsg.style.display = 'block';
            }
        }

        // دالة لاستخراج المعرف الخاص بالفيديو من أي صيغة رابط ليوتيوب
        function extractVideoID(url) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[7].length === 11) ? match[7] : false;
        }

        // دعم الضغط على زر Enter لتشغيل الفيديو
        document.getElementById('youtubeUrl').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadVideo();
            }
        });
    </script>

</body>
</html>
