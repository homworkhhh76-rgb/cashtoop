<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6d28d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="كاش توب 2">
  <title>تثبيت كاش توب</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--purple:#6d28d9;--purple2:#8b5cf6;--green:#16a34a;--green2:#22c55e;--blue:#176b7b;--dark:#111827;--ink:#1f1635}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Cairo,system-ui,sans-serif;background:linear-gradient(135deg,#f4efff,#eef1f7);display:flex;align-items:center;justify-content:center;padding:22px;color:var(--ink)}
    .card{width:min(620px,100%);background:#fff;border-radius:32px;padding:34px 28px 28px;box-shadow:0 25px 70px rgba(31,22,53,.12);text-align:center}
    .logo{width:150px;height:150px;border-radius:34px;object-fit:cover;display:block;margin:0 auto 28px;box-shadow:0 18px 35px rgba(109,40,217,.22)}
    h1{margin:0;color:#171125;font-size:clamp(32px,7vw,56px);line-height:1.28;font-weight:800}
    .subtitle{margin:18px auto 30px;max-width:520px;color:#737181;font-size:clamp(17px,4vw,22px);line-height:2}
    .buttons{display:grid;gap:14px}
    .install-btn{border:0;border-radius:20px;min-height:72px;padding:15px 20px;color:#fff;font:800 20px Cairo;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 12px 22px rgba(0,0,0,.12);transition:transform .18s,filter .18s,opacity .18s}
    .install-btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
    .install-btn:active{transform:translateY(0)}
    .android{background:linear-gradient(135deg,var(--green),var(--green2))}
    .ios{background:#111827}
    .pc{background:linear-gradient(135deg,#176b7b,#0f879b)}
    .icon{width:28px;height:28px;display:grid;place-items:center;flex:none}
    .status{min-height:24px;margin-top:18px;color:#737181;font-size:13px;line-height:1.8}
    .hidden{display:none!important}
    .modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
    .modal.show{display:flex}
    .modal-box{width:min(500px,100%);background:#fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.25)}
    .modal-box h2{margin:0 0 10px;font-size:24px}.modal-box p{margin:0;color:#666;line-height:1.9}.close{margin-top:16px;border:0;border-radius:14px;background:#6d28d9;color:#fff;padding:10px 18px;font:700 15px Cairo;cursor:pointer}
    @media(max-width:520px){.card{padding:28px 18px 22px;border-radius:28px}.logo{width:132px;height:132px}.install-btn{min-height:68px;font-size:18px}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./icon-512.png" alt="كاش توب">
    <h1>تطبيق كاش توب المحاسبي</h1>
    <p class="subtitle">ثبّت كاش توب على جهازك ليعمل كتطبيق مستقل، لادارة حساباتك.</p>

    <div class="buttons">
      <button class="install-btn android" id="androidBtn" type="button">
        <span class="icon" aria-hidden="true">🤖</span><span>تثبيت على الأندرويد</span>
      </button>
      <button class="install-btn ios" id="iosBtn" type="button">
        <span class="icon" aria-hidden="true"></span><span>تثبيت على الآيفون</span>
      </button>
      <button class="install-btn pc" id="pcBtn" type="button">
        <span class="icon" aria-hidden="true">💻</span><span>تثبيت على الكمبيوتر</span>
      </button>
    </div>

    <div class="status" id="status"></div>
  </main>

  <div class="modal" id="iosModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="iosTitle">
      <h2 id="iosTitle">تثبيت كاش توب على الآيفون</h2>
      <p>التثبيت المباشر للـPWA من زر داخل صفحة الويب غير متاح في iOS. يلزم تنفيذ أمر التثبيت من Safari نفسه.</p>
      <button class="close" id="iosClose" type="button">حسنًا</button>
    </div>
  </div>

<script>
(() => {
  let deferredPrompt = null;
  const androidBtn = document.getElementById('androidBtn');
  const iosBtn = document.getElementById('iosBtn');
  const pcBtn = document.getElementById('pcBtn');
  const status = document.getElementById('status');
  const iosModal = document.getElementById('iosModal');
  const iosClose = document.getElementById('iosClose');

  const isStandalone = () => window.matchMedia?.('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function setStatus(text){ status.textContent = text || ''; }

  // نفس آلية زر التثبيت الموجودة داخل كاش توب.
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    deferredPrompt = event;
    setStatus('التثبيت جاهز. اضغط زر جهازك الآن.');
  });

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    setStatus('تم تثبيت كاش توب بنجاح.');
    androidBtn.disabled = true;
    pcBtn.disabled = true;
    androidBtn.style.opacity = '.65';
    pcBtn.style.opacity = '.65';
  });

  async function install() {
    if (isStandalone()) {
      setStatus('كاش توب مثبت بالفعل على هذا الجهاز.');
      return;
    }
    if (!deferredPrompt) {
      setStatus('التثبيت المباشر غير متاح حاليًا لهذا المتصفح أو أن الصفحة لا تعمل عبر HTTPS.');
      return;
    }
    const promptEvent = deferredPrompt;
    deferredPrompt = null;
    try {
      await promptEvent.prompt();
      const result = await promptEvent.userChoice;
      setStatus(result?.outcome === 'accepted' ? 'تم بدء تثبيت كاش توب.' : 'تم إلغاء التثبيت.');
    } catch (error) {
      console.error(error);
      setStatus('تعذر بدء التثبيت.');
    }
  }

  androidBtn.addEventListener('click', install);
  pcBtn.addEventListener('click', install);

  iosBtn.addEventListener('click', () => {
    if (isStandalone()) {
      setStatus('كاش توب مثبت بالفعل على هذا الجهاز.');
      return;
    }
    iosModal.classList.add('show');
    iosModal.setAttribute('aria-hidden','false');
  });
  iosClose.addEventListener('click', () => {
    iosModal.classList.remove('show');
    iosModal.setAttribute('aria-hidden','true');
  });
  iosModal.addEventListener('click', e => { if(e.target === iosModal) iosClose.click(); });

  if (isIOS()) setStatus('اضغط «تثبيت على الآيفون» للمتابعة.');

  // تسجيل نفس Service Worker الخاص بكاش توب حتى تستوفي الصفحة شروط PWA.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./service-worker.js', {scope:'./', updateViaCache:'none'}).catch(err => console.warn('SW:', err));
  }
})();
</script>
</body>
</html>
