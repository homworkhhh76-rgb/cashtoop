body{margin:0;min-height:100vh;font-family:Cairo,sans-serif;background:radial-gradient(circle at top,#ede7ff 0,#f7f7fb 42%,#eef1f5 100%);color:#201c27}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(880px,100%);background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:30px;box-shadow:0 24px 70px rgba(44,24,88,.15);padding:34px}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:132px;height:132px;border-radius:30px;object-fit:cover;box-shadow:0 14px 32px rgba(91,44,170,.28);margin-bottom:18px}
h1{margin:0;color:var(--dark);font-size:clamp(28px,5vw,42px);font-weight:800}
.subtitle{margin:10px 0 28px;color:var(--muted);font-size:16px;line-height:1.9;max-width:650px}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.btn{border:0;border-radius:17px;padding:16px 14px;font:700 16px Cairo;cursor:pointer;color:#fff;box-shadow:0 10px 25px rgba(0,0,0,.1);transition:.2s;min-height:64px}
.btn:hover{transform:translateY(-2px)}
.install{background:linear-gradient(135deg,var(--purple),var(--purple2))}
.android{background:linear-gradient(135deg,#16a34a,#22c55e)}
.android:hover{background:linear-gradient(135deg,#15803d,#16a34a)}
.ios{background:#111827}
.pc{background:#155e75}
.status{margin-top:18px;text-align:center;padding:13px 15px;border-radius:14px;background:#f7f4ff;color:#5b21b6;font-weight:700;display:none}
.section{margin-top:28px;background:#fafafa;border:1px solid #eee;border-radius:20px;padding:20px;display:none}
.section h2{font-size:19px;margin:0 0 10px;color:var(--dark)}
.section p{margin:0;color:#645e6e;line-height:1.9;font-size:14px}
.step{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.num{width:28px;height:28px;min-width:28px;border-radius:50%;background:#ede9fe;color:#6d28d9;display:flex;align-items:center;justify-content:center;font-weight:800}
.footer{text-align:center;color:#8b8593;font-size:12px;margin-top:20px}
@media(max-width:700px){.buttons{grid-template-columns:1fr}.card{padding:24px 18px;border-radius:24px}.logo{width:112px;height:112px}}
</style>
</head>

    <h1>تطبيق كاش توب المحاسبي</h1>
    <div class="subtitle">ثبّت كاش توب على جهازك ليعمل كتطبيق مستقل، لادارة حساباتك.</div>
  </div>

  <div class="buttons">
    <button id="androidBtn" class="btn android"><i class="fa-brands fa-android"></i><span class="btn-label">تثبيت على الأندرويد</span></button>
    <button id="iosBtn" class="btn ios"><i class="fa-brands fa-apple"></i><span class="btn-label">تثبيت على الآيفون</span></button>
    <button id="pcBtn" class="btn pc"><i class="fa-solid fa-laptop"></i><span class="btn-label">تثبيت على الكمبيوتر</span></button>
  </div>

  <div id="status" class="status"></div>

  <div class="footer">كاش توب • تثبيت آمن من المتصفح</div>
</div>
</div>

<script>
let deferredPrompt = null;
const androidBtn = document.getElementById('androidBtn');
const iosBtn = document.getElementById('iosBtn');
const pcBtn = document.getElementById('pcBtn');
const status = document.getElementById('status');

function showStatus(text){ status.textContent=text; status.style.display='block'; }

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});

async function startInstall(){
  if (!deferredPrompt) return false;
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  deferredPrompt = null;
  if (result.outcome === 'accepted') {
    showStatus('تم بدء تثبيت كاش توب على جهازك.');
    return true;
  }
  return false;
}

androidBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    await startInstall();
    return;
  }
  showStatus('افتح الصفحة في Chrome على أندرويد عبر HTTPS، وسيظهر التثبيت عندما يكون المتصفح جاهزًا.');
});

iosBtn.addEventListener('click', () => {
  showStatus('لتثبيت كاش توب على الآيفون، استخدم Safari على جهازك.');
});

pcBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    await startInstall();
    return;
  }
  showStatus('التثبيت متاح من Chrome أو Edge عند جاهزية المتصفح.');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
